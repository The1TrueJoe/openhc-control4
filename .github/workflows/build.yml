name: build

# Two kinds of artifact, attached to a release when one is published, and to the
# rolling `dev` pre-release on every push to main:
#   openhc-<model>.c4z          the Control4 driver, one per model, built with
#                               Control4's driver packager (Composer Pro: add driver)
#   openhc-control4.tar.gz      what goes on the box: control4/, unpacked into
#                               /data/extensions (x86_64: HC-800 and the EAs)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Lua 5.1 + zip
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.1 zip
      # One .c4z per openHC model, generated from gen.py's table (static AV + IO,
      # one SDDP type each). version = run number, so each build is newer to Composer.
      - name: Generate + self-check (Lua 5.1, as on the controller)
        working-directory: driver
        env:
          OHC_VERSION: ${{ github.run_number }}
        run: ./package.sh && lua5.1 test.lua
      - name: Check every model's packaged driver
        working-directory: driver
        run: |
          set -e
          for f in openhc-*.c4z; do
            for n in driver.xml driver.lua www/documentation.html; do unzip -l "$f" | grep -q " $n$"; done
            x=$(unzip -p "$f" driver.xml)
            v=$(printf '%s' "$x" | grep -o '<version>[^<]*</version>' | head -1)
            t=$(printf '%s' "$x" | grep -o '<type>openhc:[^<]*</type>' | head -1)
            n=$(printf '%s' "$x" | grep -o '<connection[ >]' | wc -l)
            echo "$f: $v, $t, $n connections"
            test "$v" = "<version>${{ github.run_number }}</version>"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: openhc-c4z
          path: driver/openhc-*.c4z
          if-no-files-found: error

  box:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust (x86_64 musl) + a musl C compiler for ring
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Backend
        working-directory: navigator/backend
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Box tools (c4sddp, c4zones)
        working-directory: tools
        run: cargo test && cargo build --release --target x86_64-unknown-linux-musl
      - name: Control4 Zigbee (c4zapd)
        working-directory: zigbee
        run: cargo test && cargo build --release --target x86_64-unknown-linux-musl --bin c4zapd
      - name: Audio client
        # control4-audio-client links GStreamer dynamically, so it is built against
        # an older glibc (bookworm's 2.36) than any openHC image's and runs on the
        # GStreamer the image's gstreamer feature installs. Skipped until the
        # audio-client submodule is added.
        run: |
          if [ ! -f audio-client/Cargo.toml ]; then echo "no audio-client submodule yet"; exit 0; fi
          docker run --rm -v "$PWD/audio-client:/src" -w /src debian:bookworm sh -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl ca-certificates build-essential pkg-config libgstreamer1.0-dev >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
            . "$HOME/.cargo/env" && cargo build --release --locked'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend
        working-directory: navigator/frontend
        run: npm ci && npm run build
      - name: Package the box side
        run: |
          set -e
          P=stage
          X=$P/control4
          install -d $X/bin
          install -m 0755 navigator/backend/target/x86_64-unknown-linux-musl/release/c4-fake-navigator-backend $X/bin/c4nav
          install -m 0755 tools/target/x86_64-unknown-linux-musl/release/c4sddp \
                          tools/target/x86_64-unknown-linux-musl/release/c4zones \
                          zigbee/target/x86_64-unknown-linux-musl/release/c4zapd $X/bin/
          if [ -f audio-client/target/release/c4-audio-client ]; then
            install -m 0755 audio-client/target/release/c4-audio-client $X/bin/
          fi
          cp -R navigator/frontend/dist $X/www
          install -m 0755 box/init $X/
          tar -C $P --owner=0 --group=0 -czf openhc-control4.tar.gz .
          tar -tzvf openhc-control4.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: openhc-control4
          path: openhc-control4.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: [driver, box]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"

  # The rolling `dev` pre-release: every push to main replaces its assets with
  # this run's (the names are stable, so --clobber replaces them in place).
  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [driver, box]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          # The tag first (create, or move it here), then the release on it.
          if gh api "repos/$GH_REPO/git/refs/tags/dev" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh release view dev >/dev/null 2>&1 || \
            gh release create dev --prerelease --title "dev (rolling)" \
              --notes "Rolling builds of main, replaced on every push. Not a release: for that, use the latest published one."
          gh release upload dev dist/* --clobber
