[package]
name = "openhc-control4-tools"
version = "0.1.0"
edition = "2021"
description = "Box-side helpers for openhc-control4: c4sddp (SDDP announcer) and c4zones (audio zones from openHC's outputs)"
license = "MIT"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
lto = true
